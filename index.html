<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>B-127 Field Test</title>
  <meta name="description" content="A scroll-driven fan tribute: a yellow coupe tears down a desert highway and stands up as a robot. Scroll to drive." />
  <meta name="theme-color" content="#0b0b0c" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&family=Special+Elite&family=VT323&family=Playfair+Display:ital,wght@1,700&family=Rubik+Mono+One&display=swap" rel="stylesheet" />
  <link rel="preload" as="image" href="frames/desktop/f_0001.webp" media="(min-width: 761px)" />
  <link rel="preload" as="image" href="frames/mobile/f_0001.webp" media="(max-width: 760px)" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="track" id="track">
    <div class="stage" id="stage">
      <canvas id="frame" aria-hidden="true"></canvas>
      <canvas id="dust" aria-hidden="true"></canvas>
      <div class="grade" aria-hidden="true"></div>
      <div class="grain" aria-hidden="true"></div>
      <div class="flash" id="flash" aria-hidden="true"></div>
      <div class="scrim scrim--left" aria-hidden="true"></div>
      <div class="scrim scrim--right" aria-hidden="true"></div>

      <header class="topbar">
        <div class="brand"><span class="brand__dot"></span>B-127 <span class="brand__muted">/ field test</span></div>
        <ol class="steps" id="steps"></ol>
        <button class="sound" id="soundBtn" type="button" aria-pressed="false">
          <span class="sound__bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          <span class="sound__label">Sound off</span>
        </button>
      </header>

      <section class="hero" id="hero"></section>
      <section class="panel panel--left" id="panelLeft" aria-live="polite"></section>
      <section class="panel panel--right radio" id="panelRight" aria-label="Radio transmissions"></section>
      <section class="outro" id="outro"></section>

      <div class="speedo" id="speedo" aria-hidden="true">
        <svg viewBox="0 0 120 70">
          <path class="speedo__track" d="M10 62 A50 50 0 0 1 110 62" />
          <path class="speedo__fill" id="speedoFill" d="M10 62 A50 50 0 0 1 110 62" />
        </svg>
        <div class="speedo__num"><span id="speedoNum">000</span><small>km/h</small></div>
      </div>

      <div class="intro" id="intro" role="dialog" aria-label="Start"></div>
      <div class="loader" id="loader"><span id="loaderNum">0</span>% frames loaded</div>
    </div>
  </main>

  <script src="vendor/lenis.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
